<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X89modps - Canal no YouTube</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        .logo {
            font-size: 72px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .username {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .youtube-button {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .youtube-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 0, 0, 0.6);
            background-color: #cc0000;
        }

        .youtube-button:active {
            transform: translateY(-1px);
        }

        .youtube-icon {
            margin-right: 10px;
            font-size: 1.5rem;
        }

        .redirect-info {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .countdown {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Floating particles effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .username {
                font-size: 2.5rem;
            }
            
            .youtube-button {
                padding: 15px 40px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo">🎬</div>
        <h1>Bem-vindo ao canal</h1>
        <div class="username">X89modps</div>
        <p>Clique no botão abaixo para acessar nosso canal no YouTube e conferir todo o conteúdo exclusivo!</p>
        
        <a href="https://www.youtube.com/@X89modps" target="_blank" class="youtube-button" onclick="handleClick()">
            <span class="youtube-icon">▶️</span>
            Acessar Canal
        </a>

        <div class="redirect-info">
            <p>Redirecionando automaticamente em <span class="countdown" id="countdown">5</span> segundos...</p>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Countdown and auto-redirect
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        function updateCountdown() {
            if (seconds > 0) {
                countdownElement.textContent = seconds;
                seconds--;
                setTimeout(updateCountdown, 1000);
            } else {
                window.location.href = 'https://www.youtube.com/@X89modps';
            }
        }

        // Handle button click
        function handleClick() {
            // Optional: Track the click or perform other actions
            console.log('User clicked to visit YouTube channel');
        }

        // Initialize
        createParticles();
        setTimeout(updateCountdown, 1000);
    </script>
</body>
</html>
