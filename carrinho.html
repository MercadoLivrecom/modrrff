<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - X89MODPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; }
        .loading-spinner {
            border: 3px solid rgba(212, 160, 23, 0.2);
            border-top: 3px solid #d4a017;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-[#111111] border border-[#333] rounded-xl shadow-2xl w-full max-w-md p-6 md:p-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#8b6508] via-[#d4a017] to-[#8b6508]"></div>

        <div class="text-left mb-6">
            <h1 class="text-2xl font-bold text-white mb-1">Finalizar Compra</h1>
            <p class="text-gray-400 text-sm">Preencha seus dados para gerar o pagamento via PIX.</p>
        </div>

        <form id="paymentForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Nome Completo</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-[#d4a017] text-sm"></i>
                    <input type="text" id="nome" required class="w-full pl-10 pr-4 py-3 bg-[#1a1a1a] border border-[#333] rounded-lg text-white placeholder-gray-600 focus:ring-2 focus:ring-[#d4a017] focus:border-[#d4a017] outline-none transition duration-200" placeholder="Ex: João da Silva">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">CPF (apenas números)</label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-3 top-1/2 -translate-y-1/2 text-[#d4a017] text-sm"></i>
                    <input type="text" id="cpf" required maxlength="11" pattern="\d{11}" inputmode="numeric" class="w-full pl-10 pr-4 py-3 bg-[#1a1a1a] border border-[#333] rounded-lg text-white placeholder-gray-600 focus:ring-2 focus:ring-[#d4a017] focus:border-[#d4a017] outline-none transition duration-200" placeholder="Ex: 12345678909">
                </div>
            </div>

            <button type="submit" id="btnGerar" class="w-full bg-gradient-to-r from-[#b8860b] to-[#8b6508] hover:from-[#d4a017] hover:to-[#b8860b] text-white font-bold py-3.5 rounded-lg transition-all duration-300 flex items-center justify-center shadow-lg shadow-[#b8860b]/20 mt-6">
                <span>GERAR PAGAMENTO PIX</span>
                <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
            
            <a href="index.html" class="block text-center text-sm text-gray-500 hover:text-[#d4a017] transition mt-4">
                <i class="fa-solid fa-arrow-left mr-1"></i> Voltar para o site
            </a>
        </form>

        <div id="pixArea" class="hidden text-left space-y-5 fade-in">
            <div class="text-center mb-2">
                <h2 class="text-lg font-bold text-white">Pague via PIX</h2>
                <p class="text-sm text-gray-400 mb-3">Escaneie o QR Code ou use o Copia e Cola</p>
                
                <!-- TIMER DE 5 MINUTOS -->
                <div class="inline-flex items-center gap-2 bg-red-900/20 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg font-mono text-xl font-bold">
                    <i class="fa-regular fa-clock"></i>
                    <span id="timerDisplay">05:00</span>
                </div>
            </div>
            
            <div class="flex justify-center">
                <div class="bg-white p-3 rounded-lg border-2 border-[#d4a017] shadow-lg">
                    <img id="qrCodeImg" src="" alt="QR Code PIX" class="w-48 h-48 mx-auto">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wide">PIX Copia e Cola</label>
                <div class="flex gap-2">
                    <input type="text" id="copyPaste" readonly class="flex-1 px-3 py-2.5 bg-[#1a1a1a] border border-[#333] rounded-lg text-xs text-gray-300 outline-none truncate font-mono">
                    <button onclick="copiarPix()" id="btnCopiar" class="bg-[#222] hover:bg-[#333] border border-[#444] text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-regular fa-copy"></i> Copiar
                    </button>
                </div>
            </div>
            
            <div id="statusMessage" class="flex items-center justify-center text-[#d4a017] font-semibold text-sm mt-4 bg-[#d4a017]/10 border border-[#d4a017]/20 py-3 rounded-lg">
                <span class="loading-spinner"></span> Aguardando pagamento...
            </div>
            
            <button onclick="location.reload()" class="w-full text-sm text-gray-500 hover:text-red-500 transition mt-2 py-2 border border-transparent hover:border-red-500/30 rounded-lg">
                <i class="fa-solid fa-xmark mr-1"></i> Cancelar e tentar novamente
            </button>
        </div>

        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-900/20 border border-red-500/30 text-red-400 rounded-lg text-sm text-center fade-in">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i>
            <span id="errorText"></span>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://royal-poetry-ea15rjrjrrrjrhrhrhe.adegaoliveira92.workers.dev';
        const PAGINA_SUCESSO = 'sucesso.html';
        
        let transactionId = null;
        let checkInterval = null;
        let timerInterval = null;
        let timeLeft = 300; // 5 minutos em segundos
        
        document.getElementById('cpf').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value;
            
            if (cpf.length !== 11) {
                mostrarErro('O CPF deve conter exatamente 11 números.');
                return;
            }

            const btn = document.getElementById('btnGerar');
            const originalBtnContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Processando...';
            limparErro();

            try {
                const response = await fetch(WORKER_URL + '/criar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.erro || 'Falha ao criar pagamento.');

                transactionId = data.transactionId;

                document.getElementById('paymentForm').classList.add('hidden');
                document.getElementById('pixArea').classList.remove('hidden');
                
                document.getElementById('qrCodeImg').src = data.qrcodeUrl;
                document.getElementById('copyPaste').value = data.copyPaste;

                iniciarVerificacao();
                iniciarTimer(); // Inicia o contador de 5 minutos

            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
                mostrarErro(error.message || 'Erro de conexão. Tente novamente.');
            }
        });

        function iniciarTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timerDisplay').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    clearInterval(checkInterval);
                    const statusEl = document.getElementById('statusMessage');
                    statusEl.className = 'flex items-center justify-center text-red-500 font-bold text-sm mt-4 bg-red-500/10 border border-red-500/20 py-3 rounded-lg fade-in';
                    statusEl.innerHTML = '<i class="fa-solid fa-clock mr-2"></i> Tempo expirado. Por favor, gere um novo PIX.';
                    document.getElementById('btnCopiar').disabled = true;
                    document.getElementById('btnCopiar').classList.add('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        function iniciarVerificacao() {
            const statusEl = document.getElementById('statusMessage');
            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(WORKER_URL + '/verificar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ transactionId })
                    });
                    const data = await response.json();

                    if (data.status === 'COMPLETO') {
                        clearInterval(checkInterval);
                        clearInterval(timerInterval); // Para o timer se pagar
                        statusEl.className = 'flex items-center justify-center text-green-500 font-bold text-base mt-4 bg-green-500/10 border border-green-500/20 py-3 rounded-lg fade-in';
                        statusEl.innerHTML = '<i class="fa-solid fa-circle-check mr-2 text-lg"></i> Pagamento confirmado! Redirecionando...';
                        setTimeout(() => { window.location.href = PAGINA_SUCESSO + '?txid=' + transactionId; }, 2000);
                    } else if (data.status === 'FALHA' || data.status === 'EXPIRADO') {
                        clearInterval(checkInterval);
                        clearInterval(timerInterval);
                        statusEl.className = 'flex items-center justify-center text-red-500 font-bold text-base mt-4 bg-red-500/10 border border-red-500/20 py-3 rounded-lg fade-in';
                        statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark mr-2 text-lg"></i> O pagamento falhou ou expirou.';
                    }
                } catch (error) { console.error('Erro na verificação:', error); }
            }, 5000);
        }

        function copiarPix() {
            const copyText = document.getElementById('copyPaste');
            navigator.clipboard.writeText(copyText.value).then(() => {
                const btn = document.getElementById('btnCopiar');
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
                btn.classList.remove('bg-[#222]', 'hover:bg-[#333]', 'border-[#444]');
                btn.classList.add('bg-green-600', 'hover:bg-green-700', 'border-green-600', 'text-white');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('bg-green-600', 'hover:bg-green-700', 'border-green-600');
                    btn.classList.add('bg-[#222]', 'hover:bg-[#333]', 'border-[#444]');
                }, 2000);
            });
        }

        function mostrarErro(msg) {
            document.getElementById('errorText').innerText = msg;
            document.getElementById('errorMessage').classList.remove('hidden');
        }
        function limparErro() {
            document.getElementById('errorMessage').classList.add('hidden');
        }
    </script>
</body>
</html>
